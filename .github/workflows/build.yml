name: Unzip and Build APK

on:
  push:
    paths:
      - 'alkamel-smart-card-finder-project.zip'
      - '.github/workflows/build.yml'
      - '.github/patches/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o alkamel-smart-card-finder-project.zip -d extracted
          cp -R extracted/alkamel-smart-card-finder/. .

      - name: Patch Kotlin compile errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/alkamel/cardfinder/MainActivity.kt")
          s = p.read_text()
          s, n1 = re.subn(r'\bsingleLine\s*=\s*true\b', 'setSingleLine(true)', s)
          s, n2 = s.replace('takePicture.launch(cameraUri)', 'takePicture.launch(cameraUri ?: return)'), s.count('takePicture.launch(cameraUri)')
          p.write_text(s)
          print(f"Fixed singleLine occurrences: {n1}")
          print(f"Fixed nullable cameraUri launches: {n2}")
          PY

      - name: Apply image OCR and import progress improvements
        run: python3 .github/patches/fix_features.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alkamel-smart-card-finder-apk
          path: app/build/outputs/apk/debug/*.apk
