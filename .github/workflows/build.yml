name: Build Latest Modified Project

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Keep only the newest requested build; cancel builds for older commits.
concurrency:
  group: latest-project-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest pushed project revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Select and extract latest modified project archive
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ZIP="$(git ls-files '*.zip' | while IFS= read -r file; do
            printf '%s\t%s\n' "$(git log -1 --format=%ct -- "$file")" "$file"
          done | sort -nr | head -n1 | cut -f2-)"
          if [ -z "${PROJECT_ZIP}" ] || [ ! -f "${PROJECT_ZIP}" ]; then
            echo "No project ZIP archive found in the latest commit."
            exit 1
          fi
          echo "Building project archive: ${PROJECT_ZIP}"
          rm -rf extracted
          mkdir -p extracted
          unzip -o "${PROJECT_ZIP}" -d extracted
          PROJECT_DIR="$(find extracted -mindepth 1 -maxdepth 3 -type f -name settings.gradle -o -name settings.gradle.kts | head -n1 | xargs -r dirname)"
          if [ -z "${PROJECT_DIR}" ]; then
            echo "Could not locate Gradle project inside ${PROJECT_ZIP}"
            exit 1
          fi
          cp -R "${PROJECT_DIR}/." .

      - name: Patch Kotlin compile errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/alkamel/cardfinder/MainActivity.kt")
          if not p.exists():
              raise SystemExit("MainActivity.kt not found in selected project archive")
          s = p.read_text()
          s, n1 = re.subn(r'\\bsingleLine\\s*=\\s*true\\b', 'setSingleLine(true)', s)
          old = 'takePicture.launch(cameraUri)'
          n2 = s.count(old)
          s = s.replace(old, 'takePicture.launch(cameraUri ?: return)')
          p.write_text(s)
          print(f"Fixed singleLine occurrences: {n1}")
          print(f"Fixed nullable cameraUri launches: {n2}")
          PY

      - name: Apply image OCR and import progress improvements
        run: python3 .github/patches/fix_features.py

      - name: Configure permanent APK signing
        env:
          ALKAMEL_KEYSTORE_BASE64: ${{ secrets.ALKAMEL_KEYSTORE_BASE64 }}
          ALKAMEL_KEYSTORE_PASSWORD: ${{ secrets.ALKAMEL_KEYSTORE_PASSWORD }}
          ALKAMEL_KEY_ALIAS: ${{ secrets.ALKAMEL_KEY_ALIAS }}
          ALKAMEL_KEY_PASSWORD: ${{ secrets.ALKAMEL_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "${ALKAMEL_KEYSTORE_BASE64}" ] || [ -z "${ALKAMEL_KEYSTORE_PASSWORD}" ] || [ -z "${ALKAMEL_KEY_ALIAS}" ] || [ -z "${ALKAMEL_KEY_PASSWORD}" ]; then
            echo "::error::Permanent signing secrets are missing. Add ALKAMEL_KEYSTORE_BASE64, ALKAMEL_KEYSTORE_PASSWORD, ALKAMEL_KEY_ALIAS, and ALKAMEL_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          echo "${ALKAMEL_KEYSTORE_BASE64}" | base64 --decode > alkamel-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("app/build.gradle")
          s = p.read_text()
          s = s.replace('versionCode 1', 'versionCode ' + os.environ['APP_VERSION_CODE'])
          if 'signingConfigs {' not in s:
              block = """    signingConfigs {
                  stable {
                      storeFile rootProject.file('alkamel-release.jks')
                      storePassword System.getenv('ALKAMEL_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ALKAMEL_KEY_ALIAS')
                      keyPassword System.getenv('ALKAMEL_KEY_PASSWORD')
                  }
              }
          """
              s = s.replace('    buildTypes {', block + '    buildTypes {', 1)
          s = s.replace('        debug {', '        debug {\n            signingConfig signingConfigs.stable', 1)
          p.write_text(s)
          print('Configured stable APK signing and versionCode', os.environ['APP_VERSION_CODE'])
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug

      - name: Create project and APK bundle
        run: |
          set -euo pipefail
          mkdir -p release_bundle
          cp app/build/outputs/apk/debug/*.apk release_bundle/application.apk
          zip -qr release_bundle/project.zip . \
            -x "./.git/*" "./.gradle/*" "./**/build/*" "./release_bundle/*" "./extracted/*"
          cd release_bundle
          zip -q ../alkamel-smart-card-finder-package.zip project.zip application.apk

      - name: Upload project and APK package
        uses: actions/upload-artifact@v4
        with:
          name: alkamel-smart-card-finder-project-and-apk
          path: alkamel-smart-card-finder-package.zip
          if-no-files-found: error
