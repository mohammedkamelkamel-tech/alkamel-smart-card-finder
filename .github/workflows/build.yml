name: Unzip and Build APK

on:
  push:
    paths:
      - 'alkamel-smart-card-finder-project.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o alkamel-smart-card-finder-project.zip -d extracted
          cp -R extracted/alkamel-smart-card-finder/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alkamel-smart-card-finder-apk
          path: app/build/outputs/apk/debug/*.apk
